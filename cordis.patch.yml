# dsh bundle patch：把本插件插进 profile 的 loader 栈。
# 客户端插件没有自动发现机制，这条 insert 是插件出现在 boot manifest 里的必要条件。
#
# 这里只负责注册条目，不带 config：profile 里按 id 打的补丁会把 config 整体替换掉，
# 写在这里的值不会和本地配置合并，只会被覆盖，容易误解。
- insert:
    - id: feishu-assistant
      name: 'dsh-feishu-assistant'

# 配置写在你自己的 profile 补丁层（$DSH_HOME/profiles/<profile>/cordis.patch.yml）。
# 注意是「按 id 打补丁」，不是再 insert 一次 —— 重复的 loader entry id 会直接报错：
#
# - id: feishu-assistant
#   config:
#     # 飞书消息要注入哪条 DSH 会话，必须是该进程里已存在的会话。
#     sessionId: 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'
#     # 管理员 open_id；留空时在设置页生成配对码，再在飞书里私聊发给机器人。
#     managerId: ''
#     # 人设在设置页上传后由插件写入；这里只用于给初始值。
#     persona: ''
#     personaName: ''
#     # 企微提醒（可选）：开关关着或配置不全时不推送。
#     wecomEnabled: false
#     wecomCorpId: ''
#     wecomAgentId: 0   # 手动填应用 AgentId，0 表示未配置
#     wecomToUser: ''
#
# App ID / App Secret 不在这份 config 里：它们走凭据存储
# （$DSH_HOME/.credentials.yaml，引用名 FEISHU_ASSISTANT_APP_ID / FEISHU_ASSISTANT_APP_SECRET），
# 在设置页填写。
#
# 企微 Secret 也放在同一份凭据文件的 refs 下：
#   FEISHU_ASSISTANT_WECOM_SECRET: xxxxx
#
# 只写要覆盖的字段即可：schema 里带 default 的项会被补全。
